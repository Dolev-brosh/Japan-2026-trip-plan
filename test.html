<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .clamped {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
</style>
</head>
<body>
  <div id="container" class="w-64 bg-gray-100 p-4 cursor-pointer">
    <div id="text" class="text-xs text-gray-400 clamped transition-all duration-300 ease-in-out" style="-webkit-line-clamp: 1; max-height: 1.5rem;">
      Some very long text that goes on and on and on and on and on and on and on and on and on and on and on and on and on and on.
    </div>
  </div>
  <script>
    let expanded = false;
    document.getElementById('container').onclick = () => {
      expanded = !expanded;
      const text = document.getElementById('text');
      if (expanded) {
        text.style.webkitLineClamp = '10';
        text.style.maxHeight = '10rem';
      } else {
        text.style.webkitLineClamp = '1';
        text.style.maxHeight = '1.5rem';
      }
    };
  </script>
</body>
</html>
